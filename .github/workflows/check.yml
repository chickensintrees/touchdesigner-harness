name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches TouchDesigner's bundled Python
      - run: python -m pip install pytest numpy pillow "ruff==0.16.9"
      - run: ./check.sh
